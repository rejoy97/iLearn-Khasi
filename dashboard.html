<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iLearn Khasi - Dashboard</title>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #000;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
        }

        /* Sidebar Menu */
        .sidebar {
            width: 250px;
            background: #333;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px;
            display: block;
            border-radius: 5px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #555;
        }

        .menu-button {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        
        
        /* Dark Mode Styling */
        .dark-mode {
            background-color: #000000;
            color: #fff;
        }

        /* Main Container */
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Header */
        header {
            background-color: #ffffff;
            color: #000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .dark-mode header {
            background-color: #222;
            color: white;
        }

        h1 {
            margin: 0;
        }

        .menu {
            display: flex;
            gap: 20px;
        }
        .menu a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        .menu a:hover {
            text-decoration: underline;
        }

        /* Dark Mode Toggle Button */
        .toggle-container {
            display: flex;
            align-items: center;
        }

        #toggle-dark-mode {
            cursor: pointer;
            padding: 8px 15px;
            border: none;
            background-color: #000;
            color: #fff;
            border-radius: 5px;
            font-weight: bold;
        }

        .dark-mode #toggle-dark-mode {
            background-color: #fff;
            color: #000;
        }

        /* Content Area */
        .main-content {
            text-align: center;
            padding: 40px;
        }

        /* Logout Button */
        #logout-button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background-color: red;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <button class="menu-button" onclick="toggleSidebar()">☰ Menu</button>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Welcome to iLearn Khasi</h2>
        <a href="#lessons">📚 Lessons</a>
        <a href="#quizzes">📝 Quizzes</a>
        <a href="#profile">👤 Profile</a>
        <button id="logout-button">🚪 Logout</button>
    </div>

    <!-- Main Content -->
    <div class="container">
        <header>
            <h1>iLearn Khasi</h1>
            <div class="toggle-container">
                <button id="toggle-dark-mode">Dark Mode</button>
            </div>
        </header>

        <div class="main-content">
            <p>Select an option from the menu to get started.</p>
        </div>
    </div>

    <!-- Dark Mode Script -->
    <script src="dark-mode.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector(".sidebar").classList.toggle("active");
        }
         // Close sidebar when clicking outside
    document.addEventListener("click", function(event) {
        const sidebar = document.querySelector(".sidebar");
        const menuButton = document.querySelector(".menu-button");
        
        if (!sidebar.contains(event.target) && !menuButton.contains(event.target)) {
            sidebar.classList.remove("active"); // Close sidebar if clicking outside
        }
    });
    </script>
    
</body>
</html>
